<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title></title><link rel="stylesheet" href="style.css"><script type="module" src="settings.js"></script></head>
<body class="settings-page"><div id="error" role="alert" hidden></div>
  <main id="settings">
    <h2 data-i18n="settings"></h2>
    <label class="setting"><span data-i18n="language"></span><select id="language" data-aria="language"></select></label>
    <label class="setting"><span data-i18n="showLabels"></span><input type="checkbox" id="toggle-labels" aria-controls="label-panel"></label>
    <label class="setting"><span data-i18n="showLabelGuides"></span><input type="checkbox" id="toggle-label-guides" checked></label>
    <fieldset class="settings-section settings-group color-modes"><legend data-i18n="colorMode"></legend>
      <label><input type="radio" name="color-mode" value="project" checked><span data-i18n="projectColors"></span></label>
      <label><input type="radio" name="color-mode" value="timefold"><span data-i18n="timefoldColors"></span></label>
      <label><input type="radio" name="color-mode" value="auto"><span data-i18n="autoColors"></span></label>
    </fieldset>
    <section id="project-colors">
      <label class="setting"><span data-i18n="customItemColorEnabled"></span><input type="checkbox" id="custom-item-color-enabled" aria-describedby="custom-item-color-hint"></label>
      <label class="setting color-field"><span data-i18n="customItemColor"></span><input type="color" id="custom-item-color" value="#888888" aria-describedby="custom-item-color-hint" disabled></label>
      <p id="custom-item-color-hint" class="setting-hint" data-i18n="customItemColorHint"></p>
    </section>
    <section id="timefold-colors" hidden>
      <label class="setting"><span data-i18n="viewPresets"></span><select id="view-preset"></select></label>
      <label class="preset-name"><span data-i18n="presetName"></span><input id="preset-name" type="text" maxlength="128" required></label>
      <div class="preset-actions"><button id="preset-add" data-i18n="addPreset"></button><button id="preset-copy" data-i18n="copyPreset"></button><button id="preset-delete" class="danger" data-i18n="deletePreset"></button></div>
      <h3 data-i18n="folderColors"></h3>
      <div id="folder-colors"></div>
      <button id="folder-add" data-i18n="addFolder"></button>
      <p class="color-hint" data-i18n="folderColorsHint"></p>
    </section>
    <section id="auto-colors" hidden>
      <p class="color-hint" data-i18n="autoColorsHint"></p>
      <h3 data-i18n="autoColorPalette"></h3>
      <div id="auto-color-palette"></div>
      <button id="auto-palette-reset" data-i18n="restoreDefaults"></button>
    </section>
    <fieldset class="settings-section settings-group"><legend data-i18n="visibility"></legend>
      <label class="setting"><span data-i18n="showTCPHiddenTracks"></span><select id="visibility-tcpHiddenTracks"></select></label>
      <label class="setting"><span data-i18n="showMutedTracks"></span><select id="visibility-mutedTracks"></select></label>
      <label class="setting"><span data-i18n="showMutedItems"></span><select id="visibility-mutedItems"></select></label>
    </fieldset>
    <details id="shortcut-help" class="settings-section"><summary data-i18n="shortcuts"></summary><dl id="shortcuts" class="shortcut-list"></dl></details>
    <div class="dialog-actions"><span></span><button id="close-settings" data-i18n="close"></button></div>
  </main>
</body></html>
