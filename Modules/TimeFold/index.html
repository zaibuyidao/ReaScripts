<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title></title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="error" role="alert" hidden></div>
  <main id="main" data-title="settingsHint">
    <section class="arrangement" data-aria="arrangement">
      <canvas id="label-guides" aria-hidden="true"></canvas>
      <div id="timeline" data-aria="labels"><div id="labels"></div></div>
      <div id="label-divider" tabindex="0" role="separator" aria-orientation="horizontal" data-aria="labelAreaSize" hidden></div>
      <div id="tracks" tabindex="0" data-aria="arrangement"><canvas id="arrangement"></canvas><div id="viewport" data-aria="viewport"></div><canvas id="cursor"></canvas><div id="selection" hidden></div><div id="empty" data-i18n="waiting"></div></div>
    </section>
    <div id="sidebar-divider" tabindex="0" role="separator" aria-orientation="vertical" data-aria="sidebarSize" hidden></div>
    <aside id="label-panel" hidden><div class="panel-heading"><h2 data-i18n="labels"></h2><span id="label-count"></span><button id="toggle-all" disabled></button></div><p id="no-labels" data-i18n="noLabels"></p><div id="label-list" role="listbox" data-aria="labels"></div><div class="panel-footer"><button id="sidebar-fit" data-title="fitView" data-aria="fitView" disabled><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4v16M21 4v16M9 8l-4 4 4 4m6-8 4 4-4 4M5 12h14"/></svg></button><button id="sidebar-undo" data-title="undo" data-aria="undo" disabled><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 4 9l5 5M4 9h10a6 6 0 0 1 0 12"/></svg></button><button id="sidebar-redo" data-title="redo" data-aria="redo" disabled><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4 5 5-5 5m5-5H10a6 6 0 0 0 0 12"/></svg></button><button id="sidebar-markers" data-title="importMarkers" data-aria="importMarkers" disabled><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V3h12l-3 4 3 4H6"/></svg></button><button id="sidebar-regions" data-title="importRegions" data-aria="importRegions" disabled><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V3h16v18M4 11h16"/></svg></button><button id="open-settings" data-title="settings" data-aria="settings" disabled><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m9 3 1-2h4l1 2 1 2 3 0 2 3-2 3v2l2 3-2 3-3 0-1 2-1 2h-4l-1-2-1-2-3 0-2-3 2-3v-2L3 8l2-3h3z"/><circle cx="12" cy="12" r="3"/></svg></button></div></aside>
  </main>

</body>
</html>
