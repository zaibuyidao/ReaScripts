<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TrackAxis</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body class="empty-selection">
  <header class="toolbar">
    <div class="brand"><span>TRACK<b>AXIS</b></span></div>
    <div id="view-modes" class="view-modes" role="group" aria-label="TrackAxis">
      <button id="mode-track" type="button" aria-pressed="true" disabled><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M7 4h10M7 10h10M7 16h10M3 4h.01M3 10h.01M3 16h.01"/></svg><span data-i18n="viewTrack">Track</span></button>
      <button id="mode-master" type="button" aria-pressed="false" disabled><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M5 3v5m0 4v5M15 3v2m0 4v8"/><rect x="2.5" y="8" width="5" height="4" rx="1"/><rect x="12.5" y="5" width="5" height="4" rx="1"/></svg><span data-i18n="viewMaster">Master</span></button>
      <button id="settings-open" type="button" data-title="settings" aria-haspopup="dialog" aria-controls="settings-dialog" aria-keyshortcuts="Control+, Control+Alt+S"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M8 2h4l.5 2 1.5.9 2-.6 2 3.4-1.5 1.4v1.8l1.5 1.4-2 3.4-2-.6-1.5.9-.5 2H8l-.5-2-1.5-.9-2 .6-2-3.4 1.5-1.4V9.1L2 7.7l2-3.4 2 .6L7.5 4Z"/><circle cx="10" cy="10" r="2.7"/></svg><span data-i18n="settings">Settings</span></button>
    </div>
  </header>
  <div class="search-wrap">
    <div class="search-field"><input id="search" type="search" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" data-placeholder="searchPlaceholder" autocomplete="off"><button id="search-history-toggle" type="button" aria-haspopup="listbox" aria-controls="search-results" aria-expanded="false" data-title="searchHistory"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"/></svg></button></div>
    <div id="search-results" role="listbox" hidden></div>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <main>
    <div id="empty" class="empty"><h1 data-i18n="noTrack"></h1><p data-i18n="selectTrackHint"></p></div>
    <div id="inspector" hidden>
      <section id="track-header" class="track-header"></section>
      <section id="mixer" class="mixer" aria-label="Mix controls"></section>
      <details id="panel-fx" data-panel="fx"><summary><span data-i18n="fx"></span><span class="badge" id="fx-count"></span></summary><div class="panel-content"><div id="fx"></div><section id="fx-parameter-panel" aria-labelledby="fx-parameter-title" hidden><h3 id="fx-parameter-title" data-i18n="fxParameters"></h3><div id="fx-parameters"></div></section></div></details>
      <details id="panel-routing" data-panel="routing"><summary><span data-i18n="routing"></span><span class="badge" id="routing-count"></span></summary><div class="panel-content" id="routing"></div></details>
      <details id="panel-analysis" data-panel="analysis"><summary data-i18n="analysis"></summary><div class="panel-content">
        <p id="analysis-notice" class="hint"></p>
        <details class="analysis-card" id="analysis-meter" open><summary><span data-i18n="meter"></span><span class="meter-controls"><button id="meter-toggle-rms" class="meter-toggle" type="button" aria-pressed="false" data-title="meterToggleRms">RMS</button><button id="meter-toggle-lufs" class="meter-toggle" type="button" aria-pressed="true" data-title="meterToggleLufs">LUFS</button><button id="meter-reset" type="button" data-title="resetMeter" aria-label="Reset meter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button></span></summary><p class="analysis-status" role="status"></p><div class="readout" id="meter-readout"></div><div id="meter-resizer" class="list-resizer" role="separator" aria-orientation="horizontal" aria-controls="meter-readout" tabindex="0" data-title="resizeMeter"></div></details>
        <details class="analysis-card" id="analysis-spectrum" open><summary><span data-i18n="spectrum"></span><button id="spectrum-restart" class="analysis-refresh" type="button" data-analysis-kind="spectrum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button></summary><p class="analysis-status"></p><canvas height="130" aria-label="Spectrum"></canvas><div class="axis" aria-hidden="true"></div></details>
        <details class="analysis-card" id="analysis-waveform" open><summary><span data-i18n="waveform"></span><button id="waveform-restart" class="analysis-refresh" type="button" data-analysis-kind="waveform"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button></summary><p class="analysis-status"></p><canvas height="110" aria-label="Realtime waveform"></canvas></details>
      </div></details>
      <details id="panel-parameters" data-panel="parameters"><summary data-i18n="parameters"></summary><div class="panel-content" id="parameters"></div></details>
      <details id="panel-items" data-panel="items"><summary><span data-i18n="items"></span><span class="badge" id="items-count"></span></summary><div class="panel-content"><div id="items"></div><div id="overview" hidden><p id="overview-status" class="hint"></p><canvas id="overview-canvas" height="100" aria-label="Source waveform overview"></canvas></div></div></details>
      <details id="panel-metadata" data-panel="metadata"><summary data-i18n="metadata"></summary><div class="panel-content" id="metadata"></div></details>
      <details id="panel-appearance" data-panel="appearance"><summary data-i18n="appearance"></summary><div class="panel-content" id="appearance"></div></details>
      <details id="panel-quick" data-panel="quick"><summary data-i18n="quick"></summary><div class="panel-content button-grid" id="quick"></div></details>
    </div>
  </main>
  <footer><span class="connection-dot"></span><span id="connection" data-i18n="connecting"></span><span id="project-name"></span></footer>
  <div id="record-menu" class="context-menu" hidden></div>
  <div id="pan-menu" class="context-menu" role="menu" hidden></div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <div class="dialog-header"><div><p class="eyebrow">TRACKAXIS</p><h2 id="settings-title" data-i18n="settings"></h2></div><button type="button" class="icon" data-close="settings-dialog" data-title="cancel">×</button></div>
      <div class="dialog-body settings-body">
        <h3 data-i18n="displaySettings"></h3>
        <div class="row"><span id="setting-label-language" data-i18n="language"></span><select aria-labelledby="setting-label-language" name="language" id="setting-language"></select></div>
        <div class="row"><span id="setting-label-density" data-i18n="density"></span><select aria-labelledby="setting-label-density" name="density"><option value="comfortable" data-i18n="comfortable"></option><option value="compact" data-i18n="compact"></option></select></div>
        <div class="row"><span id="setting-label-theme" data-i18n="theme"></span><select aria-labelledby="setting-label-theme" name="theme"><option value="reaper" data-i18n="themeReaper"></option><option value="custom" data-i18n="themeCustom"></option></select></div>
        <div id="custom-colors" class="custom-colors" hidden>
          <div class="row"><span id="setting-label-colorBackground" data-i18n="colorBackground"></span><input aria-labelledby="setting-label-colorBackground" type="color" name="colorBackground"></div>
          <div class="row"><span id="setting-label-colorPanel" data-i18n="colorPanel"></span><input aria-labelledby="setting-label-colorPanel" type="color" name="colorPanel"></div>
          <div class="row"><span id="setting-label-colorText" data-i18n="colorText"></span><input aria-labelledby="setting-label-colorText" type="color" name="colorText"></div>
          <div class="row"><span id="setting-label-colorAccent" data-i18n="colorAccent"></span><input aria-labelledby="setting-label-colorAccent" type="color" name="colorAccent"></div>
          <div class="row"><span id="setting-label-colorBorder" data-i18n="colorBorder"></span><input aria-labelledby="setting-label-colorBorder" type="color" name="colorBorder"></div>
        </div>
        <div class="row"><span id="setting-label-searchHistoryLimit" data-i18n="searchHistoryLimit"></span><input aria-labelledby="setting-label-searchHistoryLimit" aria-describedby="search-history-hint" type="number" name="searchHistoryLimit" min="0" max="100" step="1" required></div>
        <p id="search-history-hint" class="hint" data-i18n="searchHistoryHint"></p>
        <div class="compact-settings">
          <div class="check"><input aria-labelledby="setting-label-fxCompact" type="checkbox" name="fxCompact"><span id="setting-label-fxCompact" data-i18n="fxCompact"></span></div>
          <div class="check"><input aria-labelledby="setting-label-routingCompact" type="checkbox" name="routingCompact"><span id="setting-label-routingCompact" data-i18n="routingCompact"></span></div>
        </div>
        <h3 data-i18n="analysisSettings"></h3>
        <div class="check"><input aria-labelledby="setting-label-analysis" type="checkbox" name="analysis"><span id="setting-label-analysis" data-i18n="enableAnalysis"></span></div>
        <div class="row"><span id="setting-label-source" data-i18n="analysisSource"></span><select aria-labelledby="setting-label-source" name="source"><option value="track" data-i18n="sourceTrack"></option><option value="master" data-i18n="sourceMaster"></option><option value="input" data-i18n="sourceInput"></option></select></div>
        <p id="analysis-setting-hint" class="hint" data-i18n="preFXHint"></p>
        <div class="setting-checks"><div class="check"><input aria-labelledby="setting-label-meter" type="checkbox" name="meter"><span id="setting-label-meter" data-i18n="meter"></span></div><div class="check"><input aria-labelledby="setting-label-spectrum" type="checkbox" name="spectrum"><span id="setting-label-spectrum" data-i18n="spectrum"></span></div><div class="check"><input aria-labelledby="setting-label-waveform" type="checkbox" name="waveform"><span id="setting-label-waveform" data-i18n="waveform"></span></div></div>
        <div class="row"><label for="meter-integrated-mode" data-i18n="meterIntegration"></label><select id="meter-integrated-mode" name="integratedMode"><option value="playback-only" data-i18n="meterPlaybackOnly"></option><option value="continuous" data-i18n="meterContinuous"></option></select></div>
        <label class="check"><input type="checkbox" name="resetOnPlaybackStart"><span data-i18n="meterAutoReset"></span></label>
        <label class="check" data-title="meterMonoHint"><input type="checkbox" name="forceMono"><span data-i18n="meterMono"></span></label>
        <div class="row"><span id="setting-label-fftSize" data-i18n="fftSize"></span><select aria-labelledby="setting-label-fftSize" name="fftSize"><option>512</option><option>1024</option><option>2048</option><option>4096</option><option>8192</option></select></div>
        <div class="row"><span id="setting-label-streamRate" data-i18n="streamRate"></span><select aria-labelledby="setting-label-streamRate" name="streamRate"><option value="10">10 Hz</option><option value="20">20 Hz</option><option value="30">30 Hz</option><option value="60">60 Hz</option></select></div>
        <div class="row"><span id="setting-label-drawRate" data-i18n="drawRate"></span><select aria-labelledby="setting-label-drawRate" name="drawRate"><option value="15">15 FPS</option><option value="30">30 FPS</option><option value="60">60 FPS</option></select></div>
        <div class="row"><span id="setting-label-floor" data-i18n="spectrumFloor"></span><select aria-labelledby="setting-label-floor" name="floor"><option value="-60">−60 dBFS</option><option value="-90">−90 dBFS</option><option value="-120">−120 dBFS</option></select></div>
        <p class="hint" data-i18n="settingsHint"></p>
        <h3 data-i18n="shortcuts"></h3><div class="row"><span data-i18n="openSettings"></span><span><kbd>Ctrl+,</kbd> / <kbd>Ctrl+Alt+S</kbd></span></div>
      </div>
      <div class="dialog-footer"><button type="button" id="settings-reset" data-i18n="restoreDefaults"></button><span class="spacer"></span><button type="button" data-close="settings-dialog" data-i18n="cancel"></button><button type="submit" class="primary" data-i18n="save"></button></div>
    </form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><div class="dialog-header"><h2 id="confirm-title" data-i18n="confirmDelete"></h2></div><div class="dialog-body"><p id="confirm-message"></p><p class="hint" data-i18n="undoHint"></p></div><div class="dialog-footer"><button value="cancel" autofocus data-i18n="cancel"></button><button value="delete" class="danger" data-i18n="delete"></button></div></form></dialog>
  <dialog id="fx-dialog" aria-labelledby="fx-title"><div class="dialog-header"><h2 id="fx-title" data-i18n="addFX"></h2><button class="icon" data-close="fx-dialog" data-title="cancel">×</button></div><div class="dialog-body"><input id="fx-search" type="search" role="combobox" aria-autocomplete="list" aria-controls="fx-catalog" aria-expanded="true" data-placeholder="fxSearch" autocomplete="off"><p id="fx-catalog-status" class="hint"></p><div id="fx-catalog" role="listbox"></div><form id="fx-add-form" class="row"><input id="fx-name" data-placeholder="fxExactName" required><button class="primary" data-i18n="add"></button></form></div></dialog>
  <dialog id="route-dialog" aria-labelledby="route-title"><div class="dialog-header"><h2 id="route-title"></h2><button class="icon" data-close="route-dialog" data-title="cancel">×</button></div><div class="dialog-body"><input id="route-search" type="search" data-placeholder="searchPlaceholder" autocomplete="off"><div id="route-catalog"></div></div></dialog>

</body>
</html>
