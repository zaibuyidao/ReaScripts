<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transparent Window</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header data-reaweb-drag><strong>Transparent Window</strong><button id="close" aria-label="Close">×</button></header>
    <section>
      <h1>Desktop Alpha</h1>
      <p>The transparent margin reveals REAPER. Move the window over changing content to inspect the blend.</p>
      <p>透明留白透出 REAPER。移动窗口，观察底层内容与半透明面板的混合。</p>
      <label>Panel opacity / 面板不透明度 <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.72"></label>
      <label>Input / 输入 <input type="text" placeholder="Keyboard and IME"></label>
      <div class="actions"><button id="reload">Reload / 重新加载</button><button id="dock">Test Dock rejection / 测试停靠拒绝</button></div>
      <output id="status" aria-live="polite">Connecting…</output>
    </section>
  </main>
</body>
</html>
